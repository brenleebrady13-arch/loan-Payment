<!DOCTYPE html>
<html>
<<head>
    <title>Loan Payment Calculator</title>
    <script>
        function calculatePayment() {
            let PV = parseFloat(document.getElementById("loanAmount").value);
            let n = parseFloat(document.getElementById("years").value);
            let r = parseFloat(document.getElementById("interestRate").value);

            let P = ((r / 100 / 12) * PV) / (1 - (1 + (r / 100 / 12)) ** -(n * 12));

            let formattedPayment = P.toFixed(2);

            document.getElementById("result").innerText = 
                `If you a $${PV} loan for ${n} years at ${r} interest, Your monthly payment will be: $${formattedPayment}`;
        }
    </script>
</head>
<body>

    <h1>Loan Payment Calculator</h1>
    
    <p>
        <input type="number" id="loanAmount" value="25000"> Present Value -- Amount you wish to borrow
    </p>
    <p>
        <input type="number" id="years" value="6"> Years
    </p>
    <p>
        <input type="number" id="interestRate" value="6"> % -- Annual interest rate
    </p>

    <button onclick="calculatePayment()">Calculate the Monthly Payment</button>

    <p id="result"></p>

</body>
</html>
